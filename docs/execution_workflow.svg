<svg viewBox="0 0 1060 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00e676"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#40c4ff"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1060" height="320" fill="#121212"/>

  <text x="530" y="34" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">
    Long-Only Strategy Backtest &amp; Risk-Sizing Pipeline — backtest_donchian_volume()
  </text>

  <!-- Box 1: Bar i Signal Evaluation -->
  <rect x="28" y="65" width="300" height="195" rx="8" fill="#1b1b1f" stroke="#40c4ff" stroke-width="2"/>
  <text x="178" y="92" text-anchor="middle" fill="#40c4ff" font-size="13.5" font-weight="700">Stage 1: Bar[i] Close Signal Gate</text>
  <text x="178" y="114" text-anchor="middle" fill="#ffffff" font-size="11" font-family="Consolas, monospace">Shared Scanner / Backtest Rule</text>
  <text x="178" y="138" text-anchor="middle" fill="#e1e1e1" font-size="10.5">• RVOL_i &gt;= 2.0x &amp; Effective_Z_i &gt;= 2.5σ</text>
  <text x="178" y="156" text-anchor="middle" fill="#e1e1e1" font-size="10.5">• Median Turnover &gt;= ₹1 Cr (daily NSE)</text>
  <text x="178" y="174" text-anchor="middle" fill="#e1e1e1" font-size="10.5">• Close_i &gt; max(High_{i-20:i-1}) &amp; CLV &gt;= 65%</text>
  <text x="178" y="198" text-anchor="middle" fill="#9cdcfe" font-size="10.5" font-family="Consolas, monospace">Queues: pending_entry = True</text>
  <text x="178" y="236" text-anchor="middle" fill="#aaaaaa" font-size="10">Evaluated strictly after Bar[i] closes</text>

  <line x1="328" y1="162" x2="375" y2="162" stroke="#40c4ff" stroke-width="2" marker-end="url(#arrB)"/>

  <!-- Box 2: Bar i+1 Next-Open Fill & 1% Risk Sizing -->
  <rect x="380" y="65" width="300" height="195" rx="8" fill="#1b1b1f" stroke="#ffab40" stroke-width="2"/>
  <text x="530" y="92" text-anchor="middle" fill="#ffab40" font-size="13.5" font-weight="700">Stage 2: Bar[i+1] Next-Open Fill</text>
  <text x="530" y="114" text-anchor="middle" fill="#ffffff" font-size="11" font-family="Consolas, monospace">Entry = Open_{i+1}</text>
  <text x="530" y="138" text-anchor="middle" fill="#e1e1e1" font-size="10.5" font-family="Consolas, monospace">Risk  = max(1% * Entry, 2.0 * ATR_i)</text>
  <text x="530" y="156" text-anchor="middle" fill="#e1e1e1" font-size="10.5" font-family="Consolas, monospace">Stop  = Entry - Risk</text>
  <text x="530" y="176" text-anchor="middle" fill="#e1e1e1" font-size="10.5" font-family="Consolas, monospace">Weight = min(1.0, 0.01 / (Risk / Entry))</text>
  <text x="530" y="200" text-anchor="middle" fill="#e1e1e1" font-size="10.5">• 1R loss equals -1.0% of portfolio equity</text>
  <text x="530" y="236" text-anchor="middle" fill="#00e676" font-size="10">Eliminates same-bar close look-ahead bias</text>

  <line x1="680" y1="162" x2="727" y2="162" stroke="#00e676" stroke-width="2" marker-end="url(#arrG)"/>

  <!-- Box 3: Chandelier Trail, Mid Exit & Slippage -->
  <rect x="732" y="65" width="300" height="195" rx="8" fill="#12261b" stroke="#00e676" stroke-width="2"/>
  <text x="882" y="92" text-anchor="middle" fill="#00e676" font-size="13.5" font-weight="700">Stage 3: Trail Exit &amp; Cost Model</text>
  <text x="882" y="114" text-anchor="middle" fill="#00e676" font-size="11" font-family="Consolas, monospace">Trail = max(Stop, HighClose - 2.5*ATR)</text>
  <text x="882" y="138" text-anchor="middle" fill="#ff5252" font-size="10.5" font-family="Consolas, monospace">Stop Hit : min(Open, Stop) - 0.10*ATR</text>
  <text x="882" y="156" text-anchor="middle" fill="#ffab40" font-size="10.5" font-family="Consolas, monospace">Mid Break: Close &lt; DonMid → Next Open</text>
  <text x="882" y="176" text-anchor="middle" fill="#9cdcfe" font-size="10.5" font-family="Consolas, monospace">Opt Tgt  : 4.0*ATR (stop-first priority)</text>
  <text x="882" y="202" text-anchor="middle" fill="#e1e1e1" font-size="10.5">• Deducts 0.25% round-trip NSE delivery cost</text>
  <text x="882" y="236" text-anchor="middle" fill="#aaaaaa" font-size="10">Compares Filtered vs. Raw Donchian on identical bars</text>

  <text x="530" y="296" text-anchor="middle" fill="#666666" font-size="11">
    Shared signal &amp; turnover logic across `find_anomalies()` (live screener) and `backtest_donchian_volume()`
  </text>
</svg>
