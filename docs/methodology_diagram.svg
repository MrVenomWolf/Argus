<svg viewBox="0 0 1060 600" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00b0ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00e676"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffab40"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1060" height="600" fill="#121212"/>

  <text x="530" y="36" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">
    Quantitative Volume Anomaly &amp; Donchian Breakout Pipeline — anomaly_engine.py
  </text>

  <!-- Column 1: Input OHLCV & Normalization -->
  <rect x="30" y="75" width="235" height="90" rx="8" fill="#1b1b1f" stroke="#00b0ff" stroke-width="1.5"/>
  <text x="147" y="100" text-anchor="middle" fill="#00b0ff" font-size="13" font-weight="700">1. Prior 20-Bar OHLCV Window</text>
  <text x="147" y="120" text-anchor="middle" fill="#e1e1e1" font-size="11" font-family="Consolas, monospace">History = Bars[t-20 ... t-1]</text>
  <text x="147" y="138" text-anchor="middle" fill="#aaaaaa" font-size="10">Strictly excludes Bar[t] (zero look-ahead)</text>
  <text x="147" y="153" text-anchor="middle" fill="#9cdcfe" font-size="10">+ Intraday U-Curve / Slot Normalization</text>

  <line x1="147" y1="165" x2="147" y2="215" stroke="#00b0ff" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Step 2: Outlier-Resistant Baselines -->
  <rect x="30" y="218" width="235" height="95" rx="8" fill="#1b1b1f" stroke="#00e676" stroke-width="1.5"/>
  <text x="147" y="242" text-anchor="middle" fill="#00e676" font-size="13" font-weight="700">2. Log-Space &amp; Median Transform</text>
  <text x="147" y="262" text-anchor="middle" fill="#e1e1e1" font-size="11" font-family="Consolas, monospace">V_med = median(V_{t-20:t-1})</text>
  <text x="147" y="280" text-anchor="middle" fill="#e1e1e1" font-size="11" font-family="Consolas, monospace">y_i   = ln(1 + V_i)</text>
  <text x="147" y="298" text-anchor="middle" fill="#aaaaaa" font-size="10">50% breakdown point vs. prior spikes</text>

  <!-- Step 3: Shifted Donchian & ATR -->
  <rect x="30" y="365" width="235" height="125" rx="8" fill="#1b1b1f" stroke="#ffab40" stroke-width="1.5"/>
  <text x="147" y="390" text-anchor="middle" fill="#ffab40" font-size="13" font-weight="700">3. Price Structure &amp; Wilder ATR</text>
  <text x="147" y="412" text-anchor="middle" fill="#e1e1e1" font-size="10.5" font-family="Consolas, monospace">Upper_t = max(High_{t-20:t-1})</text>
  <text x="147" y="430" text-anchor="middle" fill="#e1e1e1" font-size="10.5" font-family="Consolas, monospace">Lower_t = min(Low_{t-20:t-1})</text>
  <text x="147" y="448" text-anchor="middle" fill="#e1e1e1" font-size="10.5" font-family="Consolas, monospace">CLV_t   = (C_t - L_t)/(H_t - L_t)</text>
  <text x="147" y="466" text-anchor="middle" fill="#e1e1e1" font-size="10.5" font-family="Consolas, monospace">ATR_14  = Wilder RMA(TR, 14)</text>

  <!-- Arrows from Step 2 to Volume Metrics -->
  <line x1="265" y1="250" x2="345" y2="115" stroke="#00b0ff" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="265" y1="265" x2="345" y2="235" stroke="#00b0ff" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="265" y1="280" x2="345" y2="355" stroke="#00b0ff" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Branch A: RVOL -->
  <rect x="350" y="70" width="260" height="82" rx="8" fill="#1b1b1f" stroke="#333338"/>
  <text x="480" y="94" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Relative Volume (RVOL)</text>
  <text x="480" y="115" text-anchor="middle" fill="#00e676" font-size="11" font-family="Consolas, monospace">RVOL = V_t / median(V)</text>
  <text x="480" y="135" text-anchor="middle" fill="#aaaaaa" font-size="10">Enforces economic magnitude (&gt;= 2.0x)</text>

  <!-- Branch B: Parametric Log Z-Score -->
  <rect x="350" y="185" width="260" height="90" rx="8" fill="#1b1b1f" stroke="#333338"/>
  <text x="480" y="209" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Parametric Log Z-Score</text>
  <text x="480" y="230" text-anchor="middle" fill="#9cdcfe" font-size="11" font-family="Consolas, monospace">Z_log = (y_t - mean(y)) / std(y)</text>
  <text x="480" y="248" text-anchor="middle" fill="#aaaaaa" font-size="10">Bessel-corrected sample std (ddof=1)</text>
  <text x="480" y="263" text-anchor="middle" fill="#aaaaaa" font-size="10">Corrects right-skewed volume tail</text>

  <!-- Branch C: Non-Parametric Log-MAD Z-Score -->
  <rect x="350" y="308" width="260" height="95" rx="8" fill="#1b1b1f" stroke="#00e676" stroke-width="1.5"/>
  <text x="480" y="332" text-anchor="middle" fill="#00e676" font-size="13" font-weight="700">Robust Log-MAD Z-Score</text>
  <text x="480" y="353" text-anchor="middle" fill="#00e676" font-size="10.5" font-family="Consolas, monospace">Z_mad = 0.6745*(y_t - med(y))/MAD(y)</text>
  <text x="480" y="372" text-anchor="middle" fill="#e1e1e1" font-size="10">Computed in log-space (Gaussian valid)</text>
  <text x="480" y="388" text-anchor="middle" fill="#aaaaaa" font-size="10">Immune to prior-window variance masking</text>

  <!-- Arrows into Dual Volume Gate -->
  <line x1="610" y1="111" x2="685" y2="195" stroke="#00b0ff" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="610" y1="230" x2="685" y2="225" stroke="#00b0ff" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="610" y1="355" x2="685" y2="255" stroke="#00e676" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Dual-Threshold Statistical Gate -->
  <rect x="690" y="160" width="335" height="125" rx="8" fill="#1b1b1f" stroke="#00b0ff" stroke-width="2"/>
  <text x="857" y="186" text-anchor="middle" fill="#00b0ff" font-size="14" font-weight="700">4. Dual-Threshold Volume &amp; Turnover Gate</text>
  <text x="857" y="210" text-anchor="middle" fill="#ffffff" font-size="11" font-family="Consolas, monospace">RVOL &gt;= 2.0x &amp; Turnover &gt;= ₹1 Cr</text>
  <text x="857" y="229" text-anchor="middle" fill="#aaaaaa" font-size="11" font-weight="700">AND</text>
  <text x="857" y="248" text-anchor="middle" fill="#00e676" font-size="11" font-family="Consolas, monospace">Effective_Z &gt;= 2.5σ (Z_mad &gt; 1.4*Z_log)</text>
  <text x="857" y="270" text-anchor="middle" fill="#9cdcfe" font-size="10">+ Exact scipy.stats.t.sf p-value &amp; BH FDR q-value</text>

  <!-- Arrow from Gate + Price Structure to Final Classification -->
  <line x1="857" y1="285" x2="857" y2="345" stroke="#00e676" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="265" y1="445" x2="685" y2="445" stroke="#ffab40" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- Final Output: Breakout & Backtest Engine -->
  <rect x="690" y="350" width="335" height="175" rx="8" fill="#12261b" stroke="#00e676" stroke-width="2"/>
  <text x="857" y="376" text-anchor="middle" fill="#00e676" font-size="14" font-weight="700">5. Signal Classification &amp; Risk Engine</text>
  <text x="857" y="400" text-anchor="middle" fill="#00e676" font-size="11" font-family="Consolas, monospace">LONG BREAKOUT : Close &gt; Upper &amp; CLV &gt;= 65%</text>
  <text x="857" y="418" text-anchor="middle" fill="#ff5252" font-size="11" font-family="Consolas, monospace">SHORT BREAKDOWN: Close &lt; Lower &amp; CLV &lt;= 35%</text>
  <text x="857" y="440" text-anchor="middle" fill="#ffab40" font-size="11" font-family="Consolas, monospace">Initial Stop: Close ∓ 2*ATR | Ref Tgt: ± 4*ATR</text>
  <text x="857" y="462" text-anchor="middle" fill="#9cdcfe" font-size="11" font-family="Consolas, monospace">Trail: max(Stop, High - 2.5*ATR) + Mid Close</text>
  <text x="857" y="486" text-anchor="middle" fill="#e1e1e1" font-size="10">Long-Only Next-Open Backtester (1% risk, 0.25% cost)</text>
  <text x="857" y="504" text-anchor="middle" fill="#aaaaaa" font-size="10">Outputs to Desktop GUI + CSV + TradingView Pine Script v5</text>

  <text x="530" y="572" text-anchor="middle" fill="#666666" font-size="11">
    Scans 2,600+ NSE &amp; 500+ SPX Equities in Batches · Vectorized with NumPy, Pandas &amp; SciPy
  </text>
</svg>
